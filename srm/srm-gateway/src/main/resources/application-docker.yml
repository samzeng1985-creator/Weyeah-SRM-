spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/srm_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowMultiQueries=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET:srm@2026#JWT_SECRET_KEY}
  expiration: ${JWT_EXPIRATION:7200}

feishu:
  app-id: ${FEISHU_APP_ID:}
  app-secret: ${FEISHU_APP_SECRET:}
  tenant-key: ${FEISHU_TENANT_KEY:}
  approval-code: ${FEISHU_APPROVAL_CODE:}
  webhook-url: ${FEISHU_WEBHOOK_URL:}

wechat:
  work:
    corp-id: ${WECHAT_WORK_CORP_ID:}
    agent-id: ${WECHAT_WORK_AGENT_ID:}
    corp-secret: ${WECHAT_WORK_CORP_SECRET:}

swagger:
  enabled: true
  title: SRM采购管理系统 API文档
  description: 燃气发电机零部件采购管理系统接口文档
  version: 1.0.0
  base-package: com.srm
