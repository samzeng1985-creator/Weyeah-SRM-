server:
  port: 8080

spring:
  profiles:
    active: dev
  application:
    name: srm-gateway

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: delFlag
      logic-delete-value: 2
      logic-not-delete-value: 0

logging:
  level:
    com.srm: DEBUG
    org.mybatis: DEBUG
